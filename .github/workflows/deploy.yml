name: CI/CD Pipeline for Open Forum Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Test, Build, and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version_tag: main-${{ steps.short_sha.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Run automated tests
        run: npm run test
        working-directory: ./server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOCKER_SERVER_SSH_KEY }}

      - name: Add remote server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DOCKER_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy application via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DOCKER_SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DOCKER_SERVER_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.version_tag }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_ACTOR='$GHCR_ACTOR' TAG='$IMAGE_TAG' bash -s" << 'EOF'
          set -euo pipefail

          # App lives in the standard layout: /opt/apps/<project-name>
          cd /opt/apps/open-forum

          echo "Deploying image tag: $TAG"

          # Capture the currently-running tag for roll back to it if this deploy fails health check
          PREVIOUS_TAG=$(docker compose images app 2>/dev/null | awk 'NR==2 {print $3}' || true)
          echo "Previously running tag: ${PREVIOUS_TAG:-none}"

          # Log in to GitHub Container Registry
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

          # Pull the exact versioned image and recreate the container
          docker compose --profile migrate pull
          docker compose up -d --force-recreate --remove-orphans

          # Run database migrations against the shared Postgres instance
          docker compose run --rm migrate

          # Health check with retries instead of a blind sleep
          echo "Waiting for app to become healthy..."
          healthy=false
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "Health check passed."
              healthy=true
              break
            fi
            echo "Attempt $i/15 failed, retrying in 5s..."
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "Health check failed after 15 attempts."
            docker compose logs --tail=100

            if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$TAG" ]; then
              echo "Rolling back to previous tag: $PREVIOUS_TAG"
              TAG="$PREVIOUS_TAG" docker compose up -d --force-recreate --remove-orphans
            else
              echo "No previous tag available to roll back to — manual intervention required."
            fi

            docker logout ghcr.io
            exit 1
          fi

          docker logout ghcr.io

          # Clean up old dangling images only (safe on shared, multi-app host)
          docker image prune -f
          EOF